<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>T3 GAS Browser Bridge</title>
<style>body{font:14px system-ui,sans-serif;background:#f7f9fc;color:#172132;margin:0;padding:16px;width:360px}h1{font-size:18px;margin:0 0 6px}p{line-height:1.4}.buttons{display:flex;gap:8px}button{padding:9px 12px;cursor:pointer;border:1px solid #bbc7d5;border-radius:7px;background:white}button:disabled{opacity:.45}pre{white-space:pre-wrap;word-break:break-word;border:1px solid #d0d8e4;background:#fff;border-radius:7px;padding:12px;font:11px ui-monospace,monospace;max-height:260px;overflow:auto}.note{color:#586579;font-size:12px}</style></head>
<body><h1>T3 GAS Browser Bridge</h1><p class="note">Read-only inspection. Use only in your school's authorized Chrome Profile13. No data is transmitted.</p><div class="buttons"><button id="inspect">Inspect current tab</button></div>
<p><label for="source">Verify already-approved Demo Source (no upload):</label><input type="file" accept=".gs,.txt,text/plain" id="source"></p>
<pre id="status" role="status">No inspection performed.</pre><script src="popup.js"></script></body></html>
